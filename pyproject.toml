[project]
name = "claude-replay"
version = "0.1.0"
description = "Record claude -p traffic through mitmproxy, verify it, replay it"
requires-python = ">=3.12"
dependencies = [
    "mitmproxy>=12.3,<13",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
